<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-labelledby="title">
  <title id="title">Ethernet WAN and LAN wiring</title>
  <rect width="720" height="260" fill="#fff"/>

  <rect x="40" y="50" width="180" height="170" rx="8" fill="#f7f7f7" stroke="#555" stroke-width="1.5"/>
  <rect x="80" y="92" width="100" height="36" rx="4" fill="#fff" stroke="#555"/>
  <text x="130" y="115" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333">WAN</text>
  <rect x="80" y="164" width="100" height="36" rx="4" fill="#fff" stroke="#555"/>
  <text x="130" y="187" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333">LAN</text>

  <rect x="520" y="80" width="160" height="48" rx="6" fill="#f7f7f7" stroke="#555" stroke-width="1.5"/>
  <text x="600" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333">Router</text>

  <rect x="520" y="152" width="160" height="48" rx="6" fill="#f7f7f7" stroke="#555" stroke-width="1.5"/>
  <text x="600" y="182" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333">PC</text>

  <line x1="180" y1="110" x2="520" y2="104" stroke="#e67e22" stroke-width="2"/>
  <line x1="180" y1="182" x2="520" y2="176" stroke="#e67e22" stroke-width="2"/>
</svg>
