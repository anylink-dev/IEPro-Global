<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" role="img" aria-labelledby="title">
  <title id="title">RS232 接线 RX TX GND</title>
  <defs>
    <linearGradient id="s232-chassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7D78B8"/>
      <stop offset="100%" stop-color="#5A5494"/>
    </linearGradient>
    <linearGradient id="s232-front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6FBF42"/>
      <stop offset="100%" stop-color="#4E9A30"/>
    </linearGradient>
    <linearGradient id="s232-top" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#62B038"/>
      <stop offset="100%" stop-color="#88D45C"/>
    </linearGradient>
    <linearGradient id="s232-side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4A8E2E"/>
      <stop offset="100%" stop-color="#356824"/>
    </linearGradient>
    <linearGradient id="s232-screw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4F6F8"/>
      <stop offset="100%" stop-color="#8B949E"/>
    </linearGradient>
    <filter id="s232-shadow" x="-8%" y="-8%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <clipPath id="s232-peer-clip">
      <rect width="200" height="212" rx="10"/>
    </clipPath>
  </defs>
  <rect width="760" height="330" fill="#fff"/>

  <g filter="url(#s232-shadow)">
    <rect x="32" y="36" width="228" height="260" rx="12" fill="url(#s232-chassis)" stroke="#4E4982" stroke-width="1.2"/>
  </g>
  <rect x="44" y="48" width="204" height="236" rx="8" fill="none" stroke="#fff" stroke-opacity="0.12"/>
  <text x="146" y="62" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="1.2" fill="#fff">ANYLINK</text>
  <text x="146" y="80" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#fff">IntelliEdge Pro 400</text>

  <!-- L-block: front = wire slot, right = screw, 90° -->
  <g transform="translate(108,96)">
    <polygon points="48,18 70,2 70,152 48,168" fill="url(#s232-side)" stroke="#2C641E" stroke-width="0.9"/>
    <polygon points="0,18 22,2 70,2 48,18" fill="url(#s232-top)" stroke="#2C641E" stroke-width="0.9"/>
    <rect x="0" y="18" width="48" height="150" fill="url(#s232-front)" stroke="#2C641E" stroke-width="0.9"/>
    <line x1="0" y1="68" x2="48" y2="68" stroke="#2C641E" stroke-width="0.8"/>
    <line x1="48" y1="68" x2="70" y2="52" stroke="#2C641E" stroke-width="0.8"/>
    <line x1="0" y1="118" x2="48" y2="118" stroke="#2C641E" stroke-width="0.8"/>
    <line x1="48" y1="118" x2="70" y2="102" stroke="#2C641E" stroke-width="0.8"/>
    <!-- wire slots on the front face, center of each bay -->
    <g fill="#1A1A1A">
      <rect x="16" y="36" width="16" height="14" rx="1.5"/>
      <rect x="16" y="86" width="16" height="14" rx="1.5"/>
      <rect x="16" y="136" width="16" height="14" rx="1.5"/>
    </g>
    <g fill="#0B0B0B">
      <rect x="19" y="40" width="10" height="6" rx="0.8"/>
      <rect x="19" y="90" width="10" height="6" rx="0.8"/>
      <rect x="19" y="140" width="10" height="6" rx="0.8"/>
    </g>
    <!-- screws on the right face, center of each bay -->
    <g fill="url(#s232-screw)" stroke="#5C6370" stroke-width="0.8">
      <ellipse cx="59" cy="38" rx="5.5" ry="7.5"/>
      <ellipse cx="59" cy="88" rx="5.5" ry="7.5"/>
      <ellipse cx="59" cy="138" rx="5.5" ry="7.5"/>
    </g>
    <g fill="#9AA3AE">
      <ellipse cx="59" cy="38" rx="2.3" ry="3.2"/>
      <ellipse cx="59" cy="88" rx="2.3" ry="3.2"/>
      <ellipse cx="59" cy="138" rx="2.3" ry="3.2"/>
    </g>
    <g stroke="#4B5563" stroke-width="1.2" stroke-linecap="round">
      <line x1="59" y1="32.8" x2="59" y2="43.2"/>
      <line x1="59" y1="82.8" x2="59" y2="93.2"/>
      <line x1="59" y1="132.8" x2="59" y2="143.2"/>
    </g>
  </g>

  <g filter="url(#s232-shadow)" transform="translate(508,68)">
    <rect width="200" height="212" rx="10" fill="#EEF1F4" stroke="#6B7280" stroke-width="1.2"/>
    <g clip-path="url(#s232-peer-clip)">
      <rect width="200" height="30" fill="#4B5563"/>
    </g>
    <text x="100" y="20" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#fff">对端</text>
    <g transform="translate(82,28)">
      <rect x="0" y="18" width="36" height="150" rx="6" fill="#D5DAE0" stroke="#9AA3AE" stroke-width="1"/>
      <g fill="#374151" stroke="#1F2937" stroke-width="0.8">
        <circle cx="18" cy="43" r="8"/>
        <circle cx="18" cy="93" r="8"/>
        <circle cx="18" cy="143" r="8"/>
      </g>
      <g fill="#111827">
        <circle cx="18" cy="43" r="3.5"/>
        <circle cx="18" cy="93" r="3.5"/>
        <circle cx="18" cy="143" r="3.5"/>
      </g>
    </g>
    <text x="132" y="75" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333">RX</text>
    <text x="132" y="125" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333">TX</text>
    <text x="132" y="175" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333">GND</text>
  </g>

  <path d="M132 139 L608 189" fill="none" stroke="#C0392B" stroke-width="3" stroke-linecap="round"/>
  <path d="M132 189 L608 139" fill="none" stroke="#2471A3" stroke-width="3" stroke-linecap="round"/>
  <path d="M132 239 H608" fill="none" stroke="#1C2833" stroke-width="3" stroke-linecap="round"/>

  <text x="100" y="143" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#F3E8FF">RX1</text>
  <text x="100" y="193" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#F3E8FF">TX1</text>
  <text x="100" y="243" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#F3E8FF">GND</text>
</svg>
