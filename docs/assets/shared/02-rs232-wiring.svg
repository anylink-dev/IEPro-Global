<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-labelledby="title">
  <title id="title">RS232 wiring RX TX GND</title>
  <rect width="720" height="240" fill="#fff"/>

  <rect x="40" y="40" width="200" height="160" rx="8" fill="#f7f7f7" stroke="#555" stroke-width="1.5"/>
  <text x="140" y="88" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#333">RX1</text>
  <text x="140" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#333">TX1</text>
  <text x="140" y="168" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#333">GND</text>

  <rect x="480" y="40" width="200" height="160" rx="8" fill="#f7f7f7" stroke="#555" stroke-width="1.5"/>
  <text x="580" y="88" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#333">RX</text>
  <text x="580" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#333">TX</text>
  <text x="580" y="168" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#333">GND</text>

  <line x1="240" y1="84" x2="480" y2="124" stroke="#e67e22" stroke-width="2"/>
  <line x1="240" y1="124" x2="480" y2="84" stroke="#e67e22" stroke-width="2"/>
  <line x1="240" y1="164" x2="480" y2="164" stroke="#e67e22" stroke-width="2"/>
</svg>
