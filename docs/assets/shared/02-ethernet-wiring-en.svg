    <line x1="48" y1="6" x2="40" y2="-12" stroke="#6B7280" stroke-width="3" stroke-linecap="round"/>
    <line x1="152" y1="6" x2="160" y2="-12" stroke="#6B7280" stroke-width="3" stroke-linecap="round"/>
    <circle cx="40" cy="-12" r="4" fill="#9CA3AF"/>
    <circle cx="160" cy="-12" r="4" fill="#9CA3AF"/>
    <rect x="50" y="43" width="50" height="32" rx="3" fill="#1A1A1A"/>
    <rect x="56" y="50" width="38" height="14" fill="#2B2B2B"/>
    <rect x="108" y="51" width="11" height="11" rx="1" fill="#2ECC71"/>
    <rect x="123" y="51" width="11" height="11" rx="1" fill="#2ECC71"/>
    <rect x="138" y="51" width="11" height="11" rx="1" fill="#F1C40F"/>
