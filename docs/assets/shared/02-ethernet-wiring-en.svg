<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="780" height="330" viewBox="0 0 780 330" role="img" aria-labelledby="title">
  <title id="title">Ethernet WAN and LAN wiring</title>
  <defs>
    <linearGradient id="eth-chassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7D78B8"/>
      <stop offset="100%" stop-color="#5A5494"/>
    </linearGradient>
    <linearGradient id="eth-bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D8D8D8"/>
    </linearGradient>
    <filter id="eth-shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.4" flood-color="#000" flood-opacity="0.2"/>
    </filter>
    <clipPath id="eth-router-clip"><rect width="200" height="88" rx="10"/></clipPath>
    <clipPath id="eth-pc-clip"><rect width="200" height="88" rx="10"/></clipPath>
    <linearGradient id="eth-jacket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9BB4D4"/>
      <stop offset="40%" stop-color="#5E7EAE"/>
      <stop offset="100%" stop-color="#3E5A86"/>
    </linearGradient>
    <linearGradient id="eth-boot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7E98C0"/>
      <stop offset="100%" stop-color="#4A658C"/>
    </linearGradient>
    <linearGradient id="eth-plug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F7F5EF"/>
      <stop offset="100%" stop-color="#C9C6BC"/>
    </linearGradient>
    <g id="rj45-plug">
      <path d="M38 5 L66 1 V33 L38 29 Z" fill="url(#eth-boot)" stroke="#3E5678" stroke-width="0.8"/>
      <path d="M41 8 H62" stroke="#D8E6F4" stroke-width="1.4" opacity="0.45"/>
      <rect x="0" y="2" width="40" height="30" rx="2.2" fill="url(#eth-plug)" stroke="#9A978C" stroke-width="0.9"/>
      <path d="M8 2 L14 -5 H28 L34 2 Z" fill="#E4E0D6" stroke="#9A978C" stroke-width="0.8"/>
      <g fill="#C9A227">
        <rect x="3" y="7" width="2.2" height="20"/>
        <rect x="6.4" y="7" width="2.2" height="20"/>
        <rect x="9.8" y="7" width="2.2" height="20"/>
        <rect x="13.2" y="7" width="2.2" height="20"/>
        <rect x="16.6" y="7" width="2.2" height="20"/>
        <rect x="20" y="7" width="2.2" height="20"/>
        <rect x="23.4" y="7" width="2.2" height="20"/>
        <rect x="26.8" y="7" width="2.2" height="20"/>
      </g>
      <rect x="30" y="9" width="6" height="16" rx="0.8" fill="#B8B4A8" opacity="0.55"/>
