  <text x="154" y="98" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#fff">IntelliEdge Pro 400</text>
  <text x="58" y="158" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#F4F4F4">WAN</text>
  <text x="58" y="226" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#F4F4F4">LAN</text>
  <g transform="translate(108,118)">
