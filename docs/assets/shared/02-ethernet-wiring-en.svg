    </g>
    <text x="100" y="20" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#fff">PC</text>
    <rect x="50" y="43" width="50" height="32" rx="3" fill="#1A1A1A"/>
    <rect x="56" y="50" width="38" height="14" fill="#2B2B2B"/>
    <rect x="110" y="45" width="40" height="28" rx="3" fill="#2F3540" stroke="#1F2430"/>
    <rect x="114" y="48" width="32" height="16" fill="#9AA3B0"/>
    <rect x="126" y="66" width="8" height="3" fill="#6B7280"/>
    <rect x="116" y="70" width="28" height="2.5" rx="1" fill="#6B7280"/>
