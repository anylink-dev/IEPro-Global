  </g>

  <path d="M226 215 C 320 222, 430 255, 548 255" fill="none" stroke="#3A4E6E" stroke-width="11" stroke-linecap="round"/>
  <path d="M226 215 C 320 222, 430 255, 548 255" fill="none" stroke="url(#eth-jacket)" stroke-width="8" stroke-linecap="round"/>
  <path d="M226 212.8 C 320 219.8, 430 252.8, 548 252.8" fill="none" stroke="#D8E6F4" stroke-width="1.8" stroke-linecap="round" opacity="0.4"/>
  <use href="#rj45-plug" xlink:href="#rj45-plug" transform="translate(186,198)"/>
  <g transform="translate(558,255)">
    <use href="#rj45-plug" xlink:href="#rj45-plug" transform="scale(-1,1) translate(0,-17)"/>
