  <path d="M226 153 C 320 146, 430 135, 548 135" fill="none" stroke="#3A4E6E" stroke-width="11" stroke-linecap="round"/>
  <path d="M226 153 C 320 146, 430 135, 548 135" fill="none" stroke="url(#eth-jacket)" stroke-width="8" stroke-linecap="round"/>
  <path d="M226 150.8 C 320 143.8, 430 132.8, 548 132.8" fill="none" stroke="#D8E6F4" stroke-width="1.8" stroke-linecap="round" opacity="0.4"/>
