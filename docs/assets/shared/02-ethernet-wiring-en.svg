      <rect x="8" y="8" width="52" height="22" fill="#2B2B2B"/>
      <g fill="#C9A227">
        <rect x="12" y="12" width="4" height="10"/>
        <rect x="18" y="12" width="4" height="10"/>
        <rect x="24" y="12" width="4" height="10"/>
        <rect x="30" y="12" width="4" height="10"/>
        <rect x="36" y="12" width="4" height="10"/>
        <rect x="42" y="12" width="4" height="10"/>
        <rect x="48" y="12" width="4" height="10"/>
        <rect x="54" y="12" width="4" height="10"/>
